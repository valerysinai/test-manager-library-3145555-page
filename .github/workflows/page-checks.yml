name: Page T-23 verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: page-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build && npm test
      - name: Secret pattern scan
        run: python3 scripts/check_secrets.py && python3 -m unittest discover -s scripts -p 'test_check_secrets.py'
      - name: Real Chromium without API or external network
        run: |
          docker build -f tests/Dockerfile -t library-page-check .
          mkdir -p artifacts
          docker run --rm --network none --mount type=bind,source="$PWD/artifacts",target=/work/artifacts library-page-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t-23-browser-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
